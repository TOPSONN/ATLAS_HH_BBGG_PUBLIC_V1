name: Phase9 existing-data physics diagnostics
on:
  push:
    branches: [codex/phase9-background-model-review]
  pull_request:
    paths: ['analysis/phase9/**', 'metadata/phase9*', 'reports/phase9*', '.github/workflows/phase9-review.yml', 'CMakeLists.txt']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_methods_and_bounded_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase9 numerical, ancestry and missing-input guards
        run: python3 -B -m unittest discover -s analysis/phase9/tests -p 'test_phase9_*.py' -v
      - name: Preserve all Phase8 scientific methods
        run: python3 -B -m unittest discover -s analysis/phase8/tests -p 'test_*.py' -v
      - name: Verify bounded evidence bytes and protected historical source
        run: python3 -B analysis/phase9/scripts/validate_publication.py --repo .
      - name: Keep genuine historical physical input references intact
        run: |
          python3 -B -m simulation.hh_signal.campaign.validate_references
          python3 -B simulation/new_backgrounds/scripts/validate_references.py --repo .
          python3 -B simulation/mg5/scripts/validate_lhe.py --background-library .
          python3 -B simulation/pythia8/scripts/validate_hepmc3.py --repository .
          python3 -B simulation/delphes/scripts/validate_references.py --repo .
      - name: Explain exact evidence scope
        run: |
          echo '### Phase9 CI evidence scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'SOURCE_ONLY method tests and HISTORICAL_EVIDENCE_AUDIT of published bounded evidence.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The 6000-entry native ROOT readback and ancestry joins are separate locally executed evidence; CI does not rerun private full ROOT inputs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No new ME, integration, event generation, detector production, physical significance or figure publication.' >> "$GITHUB_STEP_SUMMARY"