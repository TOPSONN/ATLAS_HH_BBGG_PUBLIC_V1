name: G1 compact association offline repair
on:
  push:
    branches: [codex/phase7i-g1-association-bound-repair]
  pull_request:
    paths:
      - 'simulation/hh_signal/final_closure/resource_closure/**'
      - 'simulation/hh_signal/final_closure/master/history.py'
      - 'reports/phase7i_g1_association_repair/**'
      - '.github/workflows/hh_signal_g1_association_repair.yml'
permissions:
  contents: read
jobs:
  portable_offline:
    if: github.head_ref == 'codex/phase7i-g1-association-bound-repair' || github.ref_name == 'codex/phase7i-g1-association-bound-repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserved pure mock and nonphysical legacy regression
        run: |
          python3 -B -m simulation.hh_signal.final_closure.resource_closure.offline_regression --output "$RUNNER_TEMP/g1-offline.json"
          python3 -B -m simulation.hh_signal.final_closure.resource_closure.legacy_regression --output "$RUNNER_TEMP/g1-legacy.json"
      - name: Compact graph and affected source regressions
        run: >-
          python3 -B -m unittest -v
          simulation.hh_signal.final_closure.resource_closure.tests.test_g1_associations
          simulation.hh_signal.final_closure.resource_closure.tests.test_g1_acquisition
          simulation.hh_signal.final_closure.resource_closure.tests.test_g1_publication
          simulation.hh_signal.final_closure.master.test_master
          simulation.hh_signal.final_closure.tests.test_closure
      - name: Every outgoing commit and changed index private payload gate
        run: python3 -B -m simulation.hh_signal.final_closure.resource_closure.g1_association_publication
  windows_synthetic_cim:
    if: github.head_ref == 'codex/phase7i-g1-association-bound-repair' || github.ref_name == 'codex/phase7i-g1-association-bound-repair'
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: In-memory CIM only; inventory top level never executed
        shell: pwsh
        run: python -B -m unittest -v simulation.hh_signal.final_closure.resource_closure.tests.test_g1_associations
