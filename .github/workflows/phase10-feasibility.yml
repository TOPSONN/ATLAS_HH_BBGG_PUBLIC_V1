name: Phase10 source methods and bounded evidence
on:
  push:
    branches: [codex/phase10-background-model-feasibility]
  pull_request:
    paths: ['analysis/phase10/**', 'metadata/phase10*', 'reports/phase10*', '.github/workflows/phase10-feasibility.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source_methods_bounded_evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase10 independent arithmetic, sideband and physical blockers
        run: python3 -B -m unittest discover -s analysis/phase10/tests -p 'test_*.py' -v
      - name: Preserve existing scientific method tests
        run: |
          python3 -B -m unittest discover -s analysis/phase9/tests -p 'test_phase9_*.py' -v
          python3 -B -m unittest discover -s analysis/phase8/tests -p 'test_*.py' -v
      - name: Verify bounded evidence and every outgoing commit payload
        run: python3 -B analysis/phase10/scripts/validate_publication.py --repo .
      - name: Historical physical reference validators (no production)
        run: |
          python3 -B -m simulation.hh_signal.campaign.validate_references
          python3 -B simulation/new_backgrounds/scripts/validate_references.py --repo .
          python3 -B simulation/mg5/scripts/validate_lhe.py --background-library .
          python3 -B simulation/pythia8/scripts/validate_hepmc3.py --repository .
          python3 -B simulation/delphes/scripts/validate_references.py --repo .
      - name: Evidence scope
        run: |
          echo '### Phase10 CI scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'Synthetic-method tests and historical audit of bounded published evidence. Native ROOT 6000-event profiling and full local source joins are separately recorded local execution, not rerun by CI.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No ME, physical integration, hard events, generator production, physical inference or figure publication.' >> "$GITHUB_STEP_SUMMARY"
