name: Phase7 coordinated closure and preserved science
on:
  push:
    branches: [codex/phase7-final-closure]
  pull_request:
    paths: ['simulation/hh_signal/**', 'reports/phase7*', 'metadata/phase7*', '.github/workflows/hh_signal_final_closure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  closure_methods_and_evidence:
    # This resource-only branch must not synthesize HumanReview or run native methods.
    # Its exact safe legacy selection is exercised by the separate resource job.
    if: github.head_ref != 'codex/phase7i-resource-closure' && github.head_ref != 'codex/phase7i-full-controller-storage' && github.ref_name != 'codex/phase7i-full-controller-storage' && github.head_ref != 'codex/phase7i-namespace-storage-recovery' && github.ref_name != 'codex/phase7i-namespace-storage-recovery' && github.head_ref != 'codex/phase7i-autonomous-controller-recovery' && github.head_ref != 'codex/phase7i-s4-persistent-capacity-closure' && github.ref_name != 'codex/phase7i-autonomous-controller-recovery' && github.ref_name != 'codex/phase7i-s4-persistent-capacity-closure' && github.head_ref != 'codex/phase7i-admin-architecture-p1-closure' && github.ref_name != 'codex/phase7i-admin-architecture-p1-closure' && github.head_ref != 'codex/phase7i-g1-g2-feasibility' && github.ref_name != 'codex/phase7i-g1-g2-feasibility' && github.head_ref != 'codex/phase7i-master-unattended' && github.ref_name != 'codex/phase7i-master-unattended' && github.head_ref != 'codex/phase7i-g1-association-bound-repair' && github.ref_name != 'codex/phase7i-g1-association-bound-repair' && github.head_ref != 'codex/phase7i-g1-g7-engineering' && github.ref_name != 'codex/phase7i-g1-g7-engineering' && github.head_ref != 'codex/g1-guest-v2-counter-parser-repair' && github.ref_name != 'codex/g1-guest-v2-counter-parser-repair' && github.head_ref != 'codex/phase7i-g2-actual-capability' && github.ref_name != 'codex/phase7i-g2-actual-capability' && github.head_ref != 'codex/phase7i-g2-effective-diagnostic' && github.ref_name != 'codex/phase7i-g2-effective-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scientific and fail-closed methods, including independent POSIX I/O attack regression
        run: python3 -B -m unittest simulation.hh_signal.semantics_recovery.test_semantics simulation.hh_signal.final_closure.tests.test_closure simulation.hh_signal.final_closure.integration_runtime.test_runtime simulation.hh_signal.matched_integration.test_matched simulation.hh_signal.config_lock.test_guards simulation.hh_signal.integration_audit.test_audit simulation.hh_signal.campaign.test_campaign -v
      - name: Actual method/native-readback evidence, historical references and additive interpretation
        run: |
          python3 -B -m simulation.hh_signal.final_closure.src.validate
          python3 -B -m simulation.hh_signal.final_closure.integration_runtime.published
          python3 -B -m simulation.hh_signal.campaign.validate_references
          python3 -B simulation/new_backgrounds/scripts/validate_references.py
          python3 -B simulation/mg5/scripts/validate_lhe.py --background-library .
          python3 -B simulation/pythia8/scripts/validate_hepmc3.py --repository .
          python3 -B simulation/delphes/scripts/validate_references.py --repo .
      - name: STOP92 isolated native scalar methods; no ME or production rebuild
        run: python3 -B -m unittest simulation.hh_signal.final_closure.stop92_diagnostic.test_diagnostic -v
      - name: Scientific guard correction and builder review methods only
        run: python3 -B -m unittest simulation.hh_signal.final_closure.guard_correction.test_correction -v
      - name: Active Route-A builder and strict synthetic receipt methods; no production build
        run: python3 -B -m unittest simulation.hh_signal.final_closure.integration_runtime.test_route_a -v
      - name: Audit every outgoing commit and index; freeze historical science
        run: python3 -B -m simulation.hh_signal.final_closure.src.audit_payload
